# RecBole ADMMSLIM Model Configuration
# ADMM SLIM: Sparse Recommendations for Many Users
# Paper: https://doi.org/10.1145/3336191.3371774

# 모델 지정
model: ADMMSLIM

# ============================================
# ADMMSLIM 하이퍼파라미터
# ============================================

# L1 정규화 강도 (sparsity 제어)
# 높을수록 더 sparse한 item-item 관계 학습
# 탐색 범위: [1, 5, 10, 20]
lambda1: 5.0

# L2 정규화 강도
# 과적합 방지
# 탐색 범위: [100, 500, 1000, 5000]
lambda2: 1000.0

# Item popularity 기반 정규화 가중치
# 0이면 모든 아이템 동등, 높을수록 인기 아이템에 더 큰 정규화
# 탐색 범위: [0, 0.25, 0.5, 0.75, 1.0]
alpha: 0.5

# ADMM 알고리즘 수렴 파라미터
# 클수록 빠른 수렴, 너무 크면 불안정
# 탐색 범위: [1000, 10000, 100000]
rho: 10000.0

# ADMM iteration 횟수
# 탐색 범위: [50, 100, 200]
k: 100

# 양수 값만 사용 여부
# True: item-item 유사도에서 양수만 사용 (일반적으로 권장)
positive_only: True

# 열 중심화 여부
# True: 각 아이템 열의 평균을 빼서 중심화
# False: 원본 값 그대로 사용
center_columns: False

# ============================================
# 학습 설정
# ============================================

# ADMMSLIM은 전통적 모델이므로 epochs=1로 충분
epochs: 1

# 배치 크기 (평가 시 사용)
eval_batch_size: 4096

# ============================================
# 기타 설정
# ============================================

# 재현성을 위한 시드
seed: 42

# GPU 사용 (ADMMSLIM은 CPU 기반이지만 평가 시 GPU 사용 가능)
gpu_id: 0

# 체크포인트 저장
checkpoint_dir: './experiments/saved/'
