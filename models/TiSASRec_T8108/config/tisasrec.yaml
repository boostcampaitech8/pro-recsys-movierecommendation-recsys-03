# TiSASRec Configuration for Movie Recommendation
# 직접 구현한 TiSASRec 모델 사용

# ============== Environment ==============
gpu_id: 0
use_gpu: True
seed: 42
state: INFO
reproducibility: True
data_path: dataset/
checkpoint_dir: output/checkpoints/

# ============== Data ==============
dataset: ml_movie
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp

# Data filtering
# 대회 데이터는 이미 필터링되어 있으므로 추가 필터링 불필요
load_col:
    inter: [user_id, item_id, timestamp]

# ============== Training ==============
epochs: 200
train_batch_size: 256
eval_batch_size: 256
learning_rate: 0.001
train_neg_sample_args:
    distribution: uniform
    sample_num: 1
    dynamic: False

# Early stopping
stopping_step: 10
eval_step: 1

# ============== Evaluation ==============
# 대회 평가 지표: Recall@10
eval_args:
    split: {'RS': [0.8, 0.1, 0.1]}
    group_by: user
    order: TO  # Temporal Order - 시간순 정렬
    mode: full

metrics: ['Recall', 'NDCG', 'Hit']
topk: [10]
valid_metric: Recall@10

# ============== Model: TiSASRec ==============
# 커스텀 모델이므로 model 필드는 train.py에서 직접 지정

# Embedding
hidden_size: 64

# Transformer layers
n_layers: 2
n_heads: 2
inner_size: 256

# Regularization
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5

# Activation
hidden_act: gelu

# Layer normalization
layer_norm_eps: 1e-12

# Sequence length
MAX_ITEM_LIST_LENGTH: 50

# Time interval specific (TiSASRec)
# time_span: 시간 간격을 얼마나 세분화할지 (초 단위)
# 256 = 약 4분 단위로 시간 간격 구분
time_span: 256

# Loss function
loss_type: CE

# Weight initialization
initializer_range: 0.02
