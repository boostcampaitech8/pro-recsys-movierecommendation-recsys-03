# EASE Model Configuration
# models/EASE_T8108/config/ease_config.yaml

# Data paths
data:
  train_file: "../../../data/train/train_ratings.csv"
  output_dir: "../output/"

# Model hyperparameters
model:
  # EASE regularization parameter (lambda)
  reg_weight: 500.0

# Session/Page-based Weighted EASE parameters
weighted:
  enabled: false
  
  # Session parameters
  session_threshold: 1800.0   # 30 minutes - session split threshold (seconds)
  page_threshold: 30.0        # 30 seconds - page split threshold (seconds)
  
  # Weight parameters
  within_page_weight: 1.0     # Weight for item pairs within same page
  cross_page_tau: 60.0        # Time decay parameter for cross-page pairs (seconds)
  
  # Combination parameter
  alpha: 0.3                  # Weight for session-based matrix (0 = base EASE only)

# Evaluation
eval:
  # Number of items to recommend per user
  top_k: 10
  # Validation ratio (random items to hold out per user)
  valid_random_items: 9
  # Sequential items to hold out (last N items)
  valid_seq_items: 1

# Training
train:
  seed: 42
  verbose: true